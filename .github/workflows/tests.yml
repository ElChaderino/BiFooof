name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-tested.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt -c constraints-tested.txt
      - name: Run all tests
        run: python -m unittest discover -s tests -v
